name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Test (Scala ${{ matrix.scala-version }} / JDK 25)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scala-version:
          - "3.3.8"
          - "3.8.4"
          - "3.9.0"
    env:
      AUXIFY_SCALA_VERSION: ${{ matrix.scala-version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Prepare exact peer artifacts
        run: scripts/prepare-ci-dependencies.sh

      - name: Verify apply milestone
        run: scripts/verify-milestone1.sh
